<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#7fc8f8" />
    <title>Plane Goes</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <section id="spotter" class="permissions" hidden>
      <p class="kid-line">Who's spotting planes? 👀</p>
      <form id="spotter-form" class="spotter-form">
        <label class="details" for="spotter-name">Your little Spotter's name</label>
        <input id="spotter-name" class="spotter-input" type="text" autocomplete="off" autocapitalize="words"
          maxlength="40" required />
        <button class="allow-button" type="submit">Save</button>
        <button id="spotter-cancel" class="text-button" type="button" hidden>Cancel</button>
      </form>
    </section>
    <section id="log" class="log-screen" hidden>
      <div class="top-bar">
        <button id="log-back" class="text-button" type="button">‹ Spot</button>
        <button id="settings" class="text-button" type="button" aria-label="Change the Spotter's name">⚙️ Name</button>
      </div>
      <p id="log-title" class="log-title">Sighting Log 📒</p>
      <ul id="walks" class="walks"></ul>
    </section>
    <section id="permissions" class="permissions" hidden>
      <p class="kid-line">Let's find planes! ✈️</p>
      <p class="details">
        To know which plane you're pointing at, we need your location and the phone's compass.
        We only look when you tap Spot, and we never save where you are.
      </p>
      <p id="permissions-help" class="details" aria-live="polite"></p>
      <button id="allow" class="allow-button" type="button">Tap to allow</button>
    </section>
    <main id="app">
      <div class="top-bar">
        <button id="open-log" class="text-button" type="button">📒 Log</button>
      </div>
      <p id="kid-line" class="kid-line" aria-live="polite">Spot a plane! ✈️</p>
      <p id="details" class="details"></p>
      <button id="spot" class="spot-button" type="button">Spot!</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
